<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <h2><strong>Jetons</strong></h2>
    <br>
    <p>
        Couleurs, typographies et espacement utilisés par tout les composant
    </p>
    <div class="color">
        <p><strong>Couleurs</strong></p>
        <span class="color__principal"></span>
        <span class="color__courant"></span>
        <span class="color__altern"></span>
        <span class="color__border"></span>
        <span class="color__principal"></span>
        <span class="color__hover"></span>
        <span class="color__accent"></span>
        <span class="color__error"></span>
    </div>

    <div class="scenes">
        <p><strong>Scènes</strong></p>
        <span class="sc__lac">Scène du Lac</span>
        <span class="sc__forest">Scène de la Forêt</span>
        <span class="sc__kiosque">Le kiosque</span>
    </div>

    <div class="typo">
        <p><strong>Typographies</strong></p>
        <span class="font__title">Titre 40</span>
        <span class="font__subtitle">Sous Titre 28</span>
        <span class="font__into">Introduction 20</span>
        <span class="font__courant">Courant 16</span>
        <span class="font__small">Petit 14</span>
    </div>
    <div class="space">
        <p><strong>Espacement</strong></p>
        <span class="space__xs"></span>
        <span class="space__s"></span>
        <span class="space__m"></span>
        <span class="space__l"></span>  
        <span class="space__xl"></span>
    </div>
</body>
</html>
